<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="100%" height="100%">
  <!-- bKash Text -->
  <text x="10" y="54" font-family="'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="bold" fill="#000000">bKash</text>
  <!-- bKash Origami Bird -->
  <g transform="translate(130, 8) scale(0.65)">
    <!-- Main Body & Head -->
    <polygon points="20,50 65,15 110,40 68,75" fill="#E2136E"/>
    <!-- Top Wing -->
